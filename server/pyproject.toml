[project]
name = "murmur-server"
version = "0.1.0"
description = "Local TTS (Kokoro) + STT (Parakeet) server for the Murmur extension"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlx-audio==0.5.9",
  "misaki==0.9.4",
  "num2words",
  "spacy>=3.8,<4",
  "phonemizer==3.4.0",
  "espeakng-loader==0.2.4",
  "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "parakeet-mlx",
  "soundfile",
  "fastapi",
  "uvicorn",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
