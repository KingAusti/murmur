<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img class="logo" src="icons/icon48.png" alt="">
    <div class="title"><h1>Murmur</h1><span id="status" class="muted"><span class="dot"></span> Checking…</span></div>
    <button id="connect" class="secondary small" hidden>Connect</button>
  </header>

  <section class="actions">
    <button id="read" class="primary big">
      <span>▶&nbsp; Read this page</span><kbd>⌥⇧R</kbd>
    </button>
    <div class="row">
      <button id="readerView" class="secondary"><span>Reader view</span><kbd>⌥⇧E</kbd></button>
      <button id="dictate" class="secondary"><span>Dictate</span><kbd>⌥⇧D</kbd></button>
    </div>
    <button id="openPdf" class="secondary" hidden>Open this PDF in Murmur</button>
    <button id="stop" class="secondary" hidden>■&nbsp; Stop reading</button>
  </section>

  <section class="settings">
    <label class="field"><span>Voice</span><select id="voice"></select></label>
    <label class="field"><span>Speed <output id="speedOut"></output></span>
      <input id="speed" type="range" min="0.7" max="1.6" step="0.05"></label>
    <label class="switch"><span>Skip citations like [12] and (Smith, 2019)</span><input id="skipCitations" type="checkbox"></label>
    <label class="switch"><span>⌥-click any paragraph to read from there</span><input id="altClick" type="checkbox"></label>
    <label class="switch"><span>Open PDFs in Murmur's reader</span><input id="openPdfs" type="checkbox"></label>
  </section>

  <footer><a href="welcome.html" target="_blank">Setup &amp; help</a><span class="muted">Everything stays on your Mac</span></footer>
  <script src="popup.js"></script>
</body>
</html>
